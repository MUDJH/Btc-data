name: LAB BTC vs Alts Divergence

on:
  pull_request:
    branches: [ pinescript ]
    paths:
      - 'lab_btc_alts/**'
      - '.github/workflows/lab-btc-alts-divergence.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy tabulate
      - name: Run corrected full research V2
        run: python lab_btc_alts/run_btc_alts_v2.py
      - name: Package output
        run: |
          cd lab_btc_alts
          zip -r BTC_ALTS_DIVERGENCE_FULL_PASS_V2.zip output_v2
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-alts-divergence-full-pass-v2
          path: lab_btc_alts/BTC_ALTS_DIVERGENCE_FULL_PASS_V2.zip
          retention-days: 7
