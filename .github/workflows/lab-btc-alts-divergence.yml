name: LAB BTC vs Alts Divergence

on:
  push:
    branches: [ lab-btc-alts-recovery-20260801 ]
    paths:
      - 'lab_btc_alts/run_fast_recheck.py'
      - '.github/workflows/lab-btc-alts-divergence.yml'
  pull_request:
    branches: [ pinescript ]
    paths:
      - 'lab_btc_alts/run_fast_recheck.py'
      - '.github/workflows/lab-btc-alts-divergence.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab-btc-alts-recovery-20260801
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy tabulate
      - name: Run fast historical recheck
        run: python lab_btc_alts/run_fast_recheck.py
      - name: Persist audited outputs on research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab_btc_alts/fast_recheck_output/*.csv lab_btc_alts/fast_recheck_output/REPORT.md
          git commit -m "LAB results: fast BTC vs alts recheck" || true
          git push origin HEAD:lab-btc-alts-recovery-20260801
      - name: Package output
        run: |
          cd lab_btc_alts
          zip -r BTC_ALTS_FAST_RECHECK.zip fast_recheck_output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-alts-fast-recheck
          path: lab_btc_alts/BTC_ALTS_FAST_RECHECK.zip
          retention-days: 7
