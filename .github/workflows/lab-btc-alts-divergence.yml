name: LAB BTC vs Alts Divergence

on:
  pull_request:
    branches: [ pinescript ]
    paths:
      - 'lab_btc_alts/recheck_clean.py'
      - '.github/workflows/lab-btc-alts-divergence.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy tabulate
      - name: Run clean 4H and 1D recheck
        run: python lab_btc_alts/recheck_clean.py
      - name: Package output
        run: |
          cd lab_btc_alts
          zip -r BTC_ALTS_RECHECK_CLEAN.zip recheck_clean_output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-alts-recheck-clean
          path: lab_btc_alts/BTC_ALTS_RECHECK_CLEAN.zip
          retention-days: 7
