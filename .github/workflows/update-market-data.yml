name: Update crypto, gold, and S&P data tails

on:
  workflow_dispatch:
  schedule:
    - cron: "35 1 * * *"
  push:
    branches: [pinescript]
    paths:
      - "scripts/build_market_data_update.py"
      - ".github/workflows/update-market-data.yml"
      - "tests/test_market_data_update.py"

permissions:
  contents: write

concurrency:
  group: market-data-tail-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pinescript
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test data recovery and publication safeguards
        run: python -m unittest discover -s tests -p test_market_data_update.py -v

      - name: Download, normalize, deduplicate, and validate tails
        run: python scripts/build_market_data_update.py

      - name: Upload validated data artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-data-update
          path: tails/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish current tails to pinescript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tails
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update market data tails [skip ci]"
          git push origin HEAD:pinescript

      - name: Report crypto update health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("tails/manifest.json").read_text())
          for warning in data.get("warnings", []):
              print("::warning::" + json.dumps(warning))
          for error in data.get("errors", []):
              level = "error" if error.get("required_crypto") else "warning"
              print(f"::{level}::" + json.dumps(error))
          if data.get("required_crypto_failed"):
              raise SystemExit("Some crypto tails could not be updated; previous versions were retained.")
          PY


